{% extends "master.html" %}

{% block title %}Estoque | Fashion ERP{% endblock %}

{% block header_title %}Controle de Estoque{% endblock %}

{% block content %}
<div class="dashboard-grid" style="grid-template-columns: 1fr 2fr;">
    <!-- Ajuste Manual -->
    <div class="glass" style="padding: 1.5rem;">
        <h3 style="margin-bottom: 1.5rem; font-size: 1.1rem;"><i class="fas fa-edit"></i> Ajuste de Saldo</h3>
        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem;">Produto (Variação)</label>
                <select id="adj-variation" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--bg); color: white;">
                    <option value="">Carregando produtos...</option>
                </select>
            </div>
            <div>
                <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem;">Tipo de Movimentação</label>
                <select id="adj-type" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--bg); color: white;">
                    <option value="entry">Entrada (Compra/Reposição)</option>
                    <option value="adjustment">Ajuste (Correção de Inventário)</option>
                    <option value="exit">Saída (Avaria/Perda)</option>
                </select>
            </div>
            <div>
                <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem;">Quantidade</label>
                <input type="number" id="adj-qty" value="1" min="1" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--bg); color: white;">
            </div>
            <div>
                <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem;">Observação</label>
                <input type="text" id="adj-obs" placeholder="Motivo do ajuste..." style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--bg); color: white;">
            </div>
            <button class="btn btn-primary" onclick="submitAdjustment()" style="width: 100%; margin-top: 1rem; justify-content: center;">
                <i class="fas fa-sync"></i> Atualizar Estoque
            </button>
        </div>
    </div>

    <!-- Tabela de Variedades x Estoque -->
    <div class="glass" style="padding: 1.5rem;">
        <h3 style="margin-bottom: 1.5rem; font-size: 1.1rem;"><i class="fas fa-boxes"></i> Saldo por Grade</h3>
        <table id="inventory-table">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Tam. | Cor</th>
                    <th>Custo</th>
                    <th>Venda</th>
                    <th>Saldo</th>
                    <th>Lucro Est.</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="inventory-list">
                <!-- Injetado via JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let productVariations = [];

    async function loadInventory() {
        const res = await fetch('/api/products');
        const products = await res.json();
        const list = document.getElementById('inventory-list');
        const select = document.getElementById('adj-variation');
        
        list.innerHTML = '';
        select.innerHTML = '<option value="">Selecione a variação...</option>';
        productVariations = [];

        products.forEach(p => {
            p.variations.forEach(v => {
                const stock = v.stock;
                const statusClass = stock <= 0 ? 'status-offline' : (stock <= 5 ? 'status-pending' : 'status-online');
                const statusTag = stock <= 0 ? 'Esgotado' : (stock <= 5 ? 'Baixo' : 'Ok');
                
                const cost = v.cost || 0;
                const price = v.price || 0;
                const profit = (price - cost) * stock;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: 500;">${p.name}</td>
                    <td>
                        <div style="display: flex; gap: 4px; align-items: center;">
                            <span class="status-badge" style="background: rgba(255,255,255,0.05); font-weight: 700;">${v.size}</span>
                            <span style="font-size: 0.75rem; color: var(--text-muted);">${v.color || '-'}</span>
                        </div>
                    </td>
                    <td style="color: var(--secondary);">R$ ${cost.toFixed(2)}</td>
                    <td style="color: var(--accent);">R$ ${price.toFixed(2)}</td>
                    <td style="font-weight: 700;">${stock} un</td>
                    <td style="color: var(--primary); font-weight: 700;">R$ ${profit.toFixed(2)}</td>
                    <td><span class="status-badge ${statusClass}" style="padding: 0.2rem 0.6rem; font-size: 0.7rem;">${statusTag}</span></td>
                `;
                list.appendChild(tr);

                // Populate select
                const option = document.createElement('option');
                option.value = v.id;
                option.innerText = `${p.name} (${v.size}${v.color ? ' - ' + v.color : ''})`;
                select.appendChild(option);
            });
        });
    }

    async function submitAdjustment() {
        const varId = document.getElementById('adj-variation').value;
        const type = document.getElementById('adj-type').value;
        const qty = parseInt(document.getElementById('adj-qty').value);
        const obs = document.getElementById('adj-obs').value;

        if (!varId || isNaN(qty)) return alert('Selecione um produto e quantidade!');

        const btn = document.querySelector('button[onclick="submitAdjustment()"]');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';

        try {
            const res = await fetch('/api/inventory/adjust', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ variation_id: parseInt(varId), type, quantity: qty, description: obs })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                alert('Estoque atualizado com sucesso!');
                document.getElementById('adj-qty').value = 1;
                document.getElementById('adj-obs').value = '';
                loadInventory();
            } else {
                alert('Erro: ' + (data.error || 'Falha ao atualizar.'));
            }
        } catch (e) {
            alert('Falha na comunicação com o servidor.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sync"></i> Atualizar Estoque';
        }
    }

    loadInventory();
</script>
{% endblock %}
