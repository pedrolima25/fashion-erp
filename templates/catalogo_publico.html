<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ company.name }} — Catálogo Online</title>
<script>(function(){try{var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="/static/theme.js" defer></script>
<style>
    :root {
        --primary: #6366f1; --primary-light: #818cf8; --secondary: #f43f5e; --accent: #10b981;
        --bg: #0b0f1a; --surface: rgba(15, 23, 42, 0.7); --glass-border: rgba(255, 255, 255, 0.08);
        --glass-highlight: rgba(255, 255, 255, 0.14);
        --text-main: #f8fafc; --text-muted: #94a3b8;
        --input-bg: rgba(0, 0, 0, 0.25); --hover-bg: rgba(255, 255, 255, 0.05);
        --card-shadow: 0 20px 40px -18px rgba(0, 0, 0, 0.6);
    }
    [data-theme="light"] {
        --primary: #6366f1; --primary-light: #818cf8; --secondary: #e11d48; --accent: #059669;
        --bg: #eef1f8; --surface: rgba(255, 255, 255, 0.85); --glass-border: rgba(15, 23, 42, 0.1);
        --glass-highlight: rgba(15, 23, 42, 0.16);
        --text-main: #0f172a; --text-muted: #64748b;
        --input-bg: rgba(15, 23, 42, 0.05); --hover-bg: rgba(15, 23, 42, 0.05);
        --card-shadow: 0 16px 32px -16px rgba(15, 23, 42, 0.18);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', 'Segoe UI', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background: var(--bg); background-image: radial-gradient(at 0% 0%, rgba(99,102,241,0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(244,63,94,0.1) 0px, transparent 50%); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; transition: background-color 0.2s ease, color 0.2s ease; }
    .glass { background: var(--surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 14px; transition: background-color 0.2s ease, border-color 0.2s ease; }
    .btn { padding: 0.75rem 1.25rem; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.9rem; transition: all 0.15s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { box-shadow: 0 0 15px rgba(99,102,241,0.5); transform: translateY(-1px); }
    .btn-secondary { background: transparent; border: 1px solid var(--glass-border); color: var(--text-main); }
    .btn-secondary:hover { background: var(--hover-bg); }

    .theme-toggle { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--glass-border); background: var(--hover-bg); color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: all 0.15s; }
    .theme-toggle:hover { border-color: var(--primary); color: var(--primary); }

    .top-bar { max-width: 1100px; margin: 0 auto; padding: 1rem 1rem 0; display: flex; justify-content: flex-end; }

    header.store-header { text-align: center; padding: 1rem 1rem 1.75rem; }
    header.store-header .logo { width: 68px; height: 68px; border-radius: 18px; margin: 0 auto 0.9rem; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -8px rgba(99,102,241,0.5); }
    header.store-header .logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 18px; }
    header.store-header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
    header.store-header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.35rem; font-weight: 500; }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 1rem; }

    #recognize-bar { display: flex; align-items: center; gap: 0.6rem; padding: 0.85rem 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    #recognize-bar input { flex: 1; min-width: 160px; padding: 0.65rem 0.85rem; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--input-bg); color: var(--text-main); font-size: 0.85rem; }
    #recognize-bar input:focus { outline: none; border-color: var(--primary); }
    #recognize-status { font-size: 0.8rem; font-weight: 700; padding: 0.5rem 0.75rem; border-radius: 8px; display: none; width: 100%; }

    .cat-chips { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.75rem; margin-bottom: 1.25rem; }
    .cat-chip { flex-shrink: 0; padding: 0.5rem 1.1rem; border-radius: 20px; border: 1px solid var(--glass-border); background: var(--hover-bg); color: var(--text-muted); font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
    .cat-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1.1rem; padding-bottom: 2rem; }
    .card { overflow: hidden; cursor: pointer; transition: transform 0.18s, box-shadow 0.18s; position: relative; box-shadow: var(--card-shadow); }
    .card:hover { transform: translateY(-4px); border-color: var(--glass-highlight); }
    .card .img { width: 100%; height: 165px; background: var(--hover-bg); display: flex; align-items: center; justify-content: center; }
    .card .img img { width: 100%; height: 100%; object-fit: cover; }
    .card .body { padding: 0.85rem 0.9rem; }
    .card .name { font-weight: 700; font-size: 0.88rem; margin-bottom: 0.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .price { color: var(--accent); font-weight: 800; font-size: 1.05rem; }
    .card .wholesale-tag { font-size: 0.6rem; font-weight: 800; color: var(--primary-light); background: rgba(99,102,241,0.15); padding: 2px 6px; border-radius: 6px; margin-left: 0.4rem; vertical-align: middle; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 999; align-items: center; justify-content: center; padding: 1rem; }
    .overlay.open { display: flex; }
    .modal { max-width: 460px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 0; box-shadow: var(--card-shadow); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 1.4rem; border-bottom: 1px solid var(--glass-border); }
    .modal-header h3 { font-size: 1.05rem; display: flex; align-items: center; gap: 0.5rem; font-weight: 700; }
    .modal-header button { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    .modal-body { padding: 1.25rem 1.4rem; }
    .modal-footer { display: flex; gap: 0.75rem; padding: 1.1rem 1.4rem; border-top: 1px solid var(--glass-border); }

    .var-btn { padding: 0.65rem 0.4rem; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--hover-bg); color: var(--text-main); cursor: pointer; text-align: center; font-weight: 700; font-size: 0.85rem; transition: all 0.15s; }
    .var-btn:hover:not(:disabled) { background: rgba(99,102,241,0.15); border-color: var(--primary); }
    .var-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .field-label { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-bottom: 0.35rem; }
    .field-input { width: 100%; padding: 0.7rem 0.85rem; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--input-bg); color: var(--text-main); font-size: 0.9rem; margin-bottom: 0.9rem; }
    .field-input:focus { outline: none; border-color: var(--primary); }

    .cart-fab { position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%); z-index: 900; background: var(--primary); color: white; border: none; border-radius: 50px; padding: 0.9rem 1.5rem; font-weight: 800; font-size: 0.9rem; cursor: pointer; display: none; align-items: center; gap: 0.6rem; box-shadow: 0 10px 25px -5px rgba(99,102,241,0.6); }
    .cart-fab.show { display: inline-flex; }
    .cart-badge { background: rgba(255,255,255,0.25); border-radius: 20px; padding: 1px 8px; font-size: 0.78rem; }

    .cart-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.65rem; background: var(--hover-bg); border-radius: 10px; margin-bottom: 0.5rem; }
    .qty-btn { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--glass-border); background: var(--input-bg); color: var(--text-main); cursor: pointer; }
    .delivery-toggle { display: flex; gap: 0.5rem; margin-bottom: 0.9rem; }
    .delivery-toggle button { flex: 1; padding: 0.65rem; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--input-bg); color: var(--text-muted); font-weight: 700; cursor: pointer; font-size: 0.82rem; }
    .delivery-toggle button.active { background: rgba(99,102,241,0.15); border-color: var(--primary); color: var(--text-main); }

    footer.store-footer { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.72rem; }
</style>
</head>
<body>

<div class="top-bar">
    <button id="theme-toggle-btn" class="theme-toggle" onclick="toggleTheme()" title="Mudar tema"><i class="ph-bold ph-sun"></i></button>
</div>

<header class="store-header">
    <div class="logo">
        {% if company.logo_base64 %}<img src="{{ company.logo_base64 }}">{% else %}<i class="ph-bold ph-sneaker" style="color:white;font-size:1.75rem;"></i>{% endif %}
    </div>
    <h1>{{ company.name }}</h1>
    <p>Catálogo Online · {{ company.category or "" }}</p>
</header>

<div class="wrap">
    <div id="recognize-bar" class="glass">
        <i class="ph ph-identification-badge" style="color:var(--primary);font-size:1.3rem;"></i>
        <input id="phone-input" type="tel" placeholder="Seu WhatsApp (ex: 92999999999)">
        <button class="btn btn-secondary" onclick="recognizeCustomer()" style="white-space:nowrap;">Verificar</button>
        <div id="recognize-status"></div>
    </div>

    <div class="cat-chips" id="cat-chips"></div>
    <div class="cat-chips" id="brand-chips"></div>

    <div class="grid" id="product-grid"></div>
</div>

<button class="cart-fab" id="cart-fab" onclick="openCart()">
    <i class="ph ph-shopping-cart"></i>
    <span id="cart-fab-text">Carrinho</span>
    <span class="cart-badge" id="cart-badge">0</span>
</button>

<!-- Modal: Variação -->
<div class="overlay" id="variation-overlay">
    <div class="glass modal">
        <div class="modal-header">
            <h3 id="variation-title">Produto</h3>
            <button onclick="closeOverlay('variation-overlay')"><i class="ph ph-x"></i></button>
        </div>
        <div class="modal-body">
            <p id="variation-desc" style="color:var(--text-muted);font-size:0.85rem;margin-bottom:1rem;"></p>
            <div id="variation-list" style="display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem;"></div>
        </div>
    </div>
</div>

<!-- Modal: Carrinho -->
<div class="overlay" id="cart-overlay">
    <div class="glass modal">
        <div class="modal-header">
            <h3><i class="ph ph-shopping-cart" style="color:var(--primary);"></i> Seu Carrinho</h3>
            <button onclick="closeOverlay('cart-overlay')"><i class="ph ph-x"></i></button>
        </div>
        <div class="modal-body">
            <div id="cart-items"></div>
            <div id="cart-total-row" style="display:flex;justify-content:space-between;font-size:1.15rem;font-weight:800;padding-top:0.9rem;border-top:1px solid var(--glass-border);margin-top:0.5rem;">
                <span>Total</span><span id="cart-total" style="color:var(--accent);">R$ 0,00</span>
            </div>
            <p id="cart-price-hidden-note" style="display:none;color:var(--text-muted);font-size:0.78rem;padding-top:0.9rem;border-top:1px solid var(--glass-border);margin-top:0.5rem;">Valores a combinar com a loja após o pedido.</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" style="flex:1;" onclick="closeOverlay('cart-overlay')">Continuar Comprando</button>
            <button class="btn btn-primary" style="flex:1;" onclick="openCheckout()">Finalizar Pedido</button>
        </div>
    </div>
</div>

<!-- Modal: Checkout -->
<div class="overlay" id="checkout-overlay">
    <div class="glass modal">
        <div class="modal-header">
            <h3><i class="ph ph-clipboard-text" style="color:var(--primary);"></i> Finalizar Pedido</h3>
            <button onclick="closeOverlay('checkout-overlay')"><i class="ph ph-x"></i></button>
        </div>
        <div class="modal-body" id="checkout-body">
            <label class="field-label">Nome *</label>
            <input id="ck-name" class="field-input" placeholder="Seu nome completo">
            <label class="field-label">WhatsApp *</label>
            <input id="ck-phone" type="tel" class="field-input" placeholder="92999999999">

            <label class="field-label">Entrega</label>
            <div class="delivery-toggle">
                <button type="button" id="ck-pickup" onclick="setDeliveryType('pickup')" class="active">🏪 Retirar na loja</button>
                <button type="button" id="ck-delivery" onclick="setDeliveryType('delivery')">🛵 Receber em casa</button>
            </div>
            <div id="ck-address-wrap" style="display:none;">
                <label class="field-label">Endereço completo</label>
                <input id="ck-address" class="field-input" placeholder="Rua, número, bairro...">
            </div>

            <label class="field-label">Observação (opcional)</label>
            <input id="ck-notes" class="field-input" placeholder="Ex: entregar após 18h">

            <div id="checkout-error" style="display:none;color:var(--secondary);font-size:0.82rem;padding:0.5rem 0.75rem;background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.2);border-radius:6px;margin-bottom:0.5rem;"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" style="flex:1;" onclick="closeOverlay('checkout-overlay')">Voltar</button>
            <button class="btn btn-primary" style="flex:1;" id="ck-submit" onclick="submitOrder()">Confirmar Pedido</button>
        </div>
    </div>
</div>

<footer class="store-footer">Powered by Fashion ERP Pro</footer>

<script>
    const SLUG = {{ company.slug | tojson }};
    const WA_NUMBER = {{ (company.whatsapp_number or "") | tojson }};
    const PRODUCTS = {{ products_json | safe }};
    const SHOW_RETAIL_PRICE = {{ show_retail_price | tojson }};
    const SHOW_WHOLESALE_PRICE = {{ show_wholesale_price | tojson }};
    const CART_KEY = 'catalog_cart_' + SLUG;

    let customerType = 'varejo';
    let cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
    let activeProduct = null;
    let deliveryType = 'pickup';

    function money(v) { return 'R$ ' + Number(v).toFixed(2).replace('.', ','); }
    function saveCart() { localStorage.setItem(CART_KEY, JSON.stringify(cart)); }

    function effectivePrice(product, variation) {
        const wholesale = (variation && variation.wholesale) ? variation.wholesale : product.wholesale_price;
        const retail = (variation && variation.price) ? variation.price : product.price;
        if (customerType === 'atacado' && wholesale && wholesale > 0) return wholesale;
        return retail;
    }

    function isPriceVisible() {
        return customerType === 'atacado' ? SHOW_WHOLESALE_PRICE : SHOW_RETAIL_PRICE;
    }

    // --- Reconhecimento de cliente ---
    async function recognizeCustomer() {
        const phone = document.getElementById('phone-input').value.trim();
        const statusEl = document.getElementById('recognize-status');
        if (phone.length < 8) return;
        try {
            const res = await fetch(`/api/catalogo/${SLUG}/customer-lookup?phone=${encodeURIComponent(phone)}`);
            const data = await res.json();
            customerType = data.customer_type || 'varejo';
            statusEl.style.display = 'block';
            if (customerType === 'atacado') {
                statusEl.style.cssText = 'display:block;background:rgba(99,102,241,0.15);color:var(--primary-light);border:1px solid rgba(99,102,241,0.3);';
                statusEl.textContent = `🏷️ Bem-vindo${data.name ? ', ' + data.name : ''}! Preços de atacado ativados.`;
            } else if (data.found) {
                statusEl.style.cssText = 'display:block;background:rgba(16,185,129,0.12);color:#10b981;border:1px solid rgba(16,185,129,0.3);';
                statusEl.textContent = `👋 Olá de novo, ${data.name}!`;
            } else {
                statusEl.style.cssText = 'display:block;background:var(--hover-bg);color:var(--text-muted);border:1px solid var(--glass-border);';
                statusEl.textContent = 'Cliente novo — mostrando preços de varejo.';
            }
            renderProducts();
            recalcCartPrices();
        } catch (e) {}
    }

    // --- Catálogo ---
    let activeCategory = null;
    let activeBrand = null;

    function renderCategoryChips() {
        const cats = ['Todos', ...new Set(PRODUCTS.map(p => p.category))];
        const el = document.getElementById('cat-chips');
        el.innerHTML = cats.map((c, i) => `<div class="cat-chip ${i === 0 ? 'active' : ''}" onclick="filterCategory('${c.replace(/'/g, "\\'")}', this)">${c}</div>`).join('');
    }

    function renderBrandChips() {
        const brandsFound = [...new Set(PRODUCTS.map(p => p.brand).filter(Boolean))].sort();
        const el = document.getElementById('brand-chips');
        if (brandsFound.length === 0) { el.style.display = 'none'; return; }
        const brandList = ['Todas as Marcas', ...brandsFound];
        el.innerHTML = brandList.map((b, i) => `<div class="cat-chip ${i === 0 ? 'active' : ''}" onclick="filterBrand('${b.replace(/'/g, "\\'")}', this)">${b}</div>`).join('');
    }

    function filterCategory(cat, el) {
        document.querySelectorAll('#cat-chips .cat-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        activeCategory = cat === 'Todos' ? null : cat;
        renderProducts();
    }

    function filterBrand(brand, el) {
        document.querySelectorAll('#brand-chips .cat-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        activeBrand = brand === 'Todas as Marcas' ? null : brand;
        renderProducts();
    }

    function renderProducts() {
        const grid = document.getElementById('product-grid');
        let list = PRODUCTS;
        if (activeCategory) list = list.filter(p => p.category === activeCategory);
        if (activeBrand) list = list.filter(p => p.brand === activeBrand);
        if (list.length === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:3rem;">Nenhum produto disponível.</div>';
            return;
        }
        grid.innerHTML = list.map(p => {
            const price = effectivePrice(p, null);
            const showWholesaleTag = customerType === 'atacado' && p.wholesale_price > 0;
            const priceHtml = isPriceVisible()
                ? `${money(price)}${showWholesaleTag ? '<span class="wholesale-tag">ATACADO</span>' : ''}`
                : `<span style="color:var(--text-muted);font-size:0.82rem;font-weight:700;">Consulte o preço</span>`;
            const img = p.image
                ? `<img src="${p.image}">`
                : `<i class="ph ph-sneaker" style="font-size:2rem;opacity:0.2;"></i>`;
            return `
            <div class="glass card" onclick="openVariationModal(${p.id})">
                <div class="img">${img}</div>
                <div class="body">
                    ${p.brand ? `<div style="font-size:0.68rem;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:0.15rem;">${p.brand}</div>` : ''}
                    <div class="name">${p.name}</div>
                    <div class="price">${priceHtml}</div>
                </div>
            </div>`;
        }).join('');
    }

    function openVariationModal(productId) {
        const p = PRODUCTS.find(x => x.id === productId);
        if (!p) return;
        activeProduct = p;
        document.getElementById('variation-title').textContent = p.name;
        document.getElementById('variation-desc').textContent = p.description || '';
        const list = document.getElementById('variation-list');
        list.innerHTML = p.variations.map(v => {
            const inStock = v.stock > 0;
            const price = effectivePrice(p, v);
            const priceLabel = !inStock ? 'Esgotado' : (isPriceVisible() ? money(price) : 'Consulte');
            return `<button class="var-btn" ${inStock ? '' : 'disabled'} onclick="addToCart(${p.id}, ${v.id})">
                ${v.size}${v.color ? ' · ' + v.color : ''}<br><span style="font-size:0.7rem;opacity:0.8;">${priceLabel}</span>
            </button>`;
        }).join('');
        document.getElementById('variation-overlay').classList.add('open');
    }

    function addToCart(productId, variationId) {
        const p = PRODUCTS.find(x => x.id === productId);
        const v = p.variations.find(x => x.id === variationId);
        if (!p || !v) return;
        const existing = cart.find(i => i.variation_id === variationId);
        if (existing) { existing.quantity++; }
        else {
            cart.push({
                product_id: p.id, variation_id: v.id, name: p.name,
                size: v.size, color: v.color, price: effectivePrice(p, v), quantity: 1,
            });
        }
        saveCart();
        renderCartBadge();
        closeOverlay('variation-overlay');
    }

    function recalcCartPrices() {
        cart.forEach(item => {
            const p = PRODUCTS.find(x => x.id === item.product_id);
            if (!p) return;
            const v = p.variations.find(x => x.id === item.variation_id);
            item.price = effectivePrice(p, v);
        });
        saveCart();
        renderCartBadge();
    }

    function renderCartBadge() {
        const totalItems = cart.reduce((s, i) => s + i.quantity, 0);
        const fab = document.getElementById('cart-fab');
        fab.classList.toggle('show', totalItems > 0);
        document.getElementById('cart-badge').textContent = totalItems;
    }

    function openCart() {
        const container = document.getElementById('cart-items');
        const priceVisible = isPriceVisible();
        if (cart.length === 0) {
            container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:1.5rem 0;">Carrinho vazio.</p>';
        } else {
            container.innerHTML = cart.map((item, idx) => `
                <div class="cart-item">
                    <div style="flex:1;min-width:0;">
                        <div style="font-weight:700;font-size:0.85rem;">${item.name} <span style="opacity:0.6;font-size:0.75rem;">/ ${item.size}${item.color ? ' · ' + item.color : ''}</span></div>
                        <div style="color:var(--accent);font-weight:700;font-size:0.8rem;">${priceVisible ? money(item.price * item.quantity) : 'Consulte'}</div>
                    </div>
                    <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
                    <span style="min-width:18px;text-align:center;font-weight:700;">${item.quantity}</span>
                    <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
                    <button class="qty-btn" style="border-color:rgba(239,68,68,0.3);color:#ef4444;" onclick="removeItem(${idx})"><i class="fas fa-times"></i></button>
                </div>`).join('');
        }
        const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
        document.getElementById('cart-total-row').style.display = priceVisible ? 'flex' : 'none';
        document.getElementById('cart-price-hidden-note').style.display = priceVisible ? 'none' : 'block';
        document.getElementById('cart-total').textContent = money(total);
        document.getElementById('cart-overlay').classList.add('open');
    }

    function changeQty(idx, delta) {
        cart[idx].quantity = Math.max(1, cart[idx].quantity + delta);
        saveCart();
        renderCartBadge();
        openCart();
    }

    function removeItem(idx) {
        cart.splice(idx, 1);
        saveCart();
        renderCartBadge();
        openCart();
    }

    function closeOverlay(id) {
        document.getElementById(id).classList.remove('open');
    }

    function setDeliveryType(type) {
        deliveryType = type;
        document.getElementById('ck-pickup').classList.toggle('active', type === 'pickup');
        document.getElementById('ck-delivery').classList.toggle('active', type === 'delivery');
        document.getElementById('ck-address-wrap').style.display = type === 'delivery' ? 'block' : 'none';
    }

    function openCheckout() {
        if (cart.length === 0) return;
        const phone = document.getElementById('phone-input').value.trim();
        if (phone) document.getElementById('ck-phone').value = phone;
        closeOverlay('cart-overlay');
        document.getElementById('checkout-overlay').classList.add('open');
    }

    async function submitOrder() {
        const name = document.getElementById('ck-name').value.trim();
        const phone = document.getElementById('ck-phone').value.trim();
        const errEl = document.getElementById('checkout-error');
        errEl.style.display = 'none';
        if (!name || phone.length < 8) {
            errEl.textContent = 'Preencha nome e WhatsApp válidos.';
            errEl.style.display = 'block';
            return;
        }
        if (deliveryType === 'delivery' && !document.getElementById('ck-address').value.trim()) {
            errEl.textContent = 'Informe o endereço de entrega.';
            errEl.style.display = 'block';
            return;
        }
        const btn = document.getElementById('ck-submit');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

        const payload = {
            items: cart.map(i => ({ product_id: i.product_id, variation_id: i.variation_id, quantity: i.quantity, price: i.price })),
            customer_name: name,
            customer_phone: phone,
            customer_type: customerType,
            delivery_type: deliveryType,
            delivery_address: deliveryType === 'delivery' ? document.getElementById('ck-address').value.trim() : null,
            notes: document.getElementById('ck-notes').value.trim() || null,
        };

        try {
            const res = await fetch(`/api/catalogo/${SLUG}/order`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showOrderSuccess(data.order_id);
            } else {
                errEl.textContent = data.error || 'Erro ao enviar pedido.';
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = 'Confirmar Pedido';
            }
        } catch (e) {
            errEl.textContent = 'Erro de conexão. Tente novamente.';
            errEl.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = 'Confirmar Pedido';
        }
    }

    function showOrderSuccess(orderId) {
        cart = [];
        saveCart();
        renderCartBadge();
        const waLink = WA_NUMBER ? `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent('Oi! Acabei de fazer o pedido #' + orderId + ' pelo catálogo.')}` : null;
        document.getElementById('checkout-body').innerHTML = `
            <div style="text-align:center;padding:1rem 0;">
                <div style="width:56px;height:56px;background:rgba(16,185,129,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
                    <i class="fas fa-check" style="color:#10b981;font-size:1.5rem;"></i>
                </div>
                <h3 style="color:#10b981;margin-bottom:0.5rem;">Pedido #${orderId} recebido!</h3>
                <p style="color:var(--text-muted);font-size:0.9rem;">A loja vai confirmar seu pedido em breve.</p>
                ${waLink ? `<a href="${waLink}" target="_blank" class="btn btn-primary" style="margin-top:1.25rem;background:#25d366;">💬 Falar com a loja</a>` : ''}
            </div>`;
        document.querySelector('#checkout-overlay .modal-footer').style.display = 'none';
    }

    renderCategoryChips();
    renderBrandChips();
    renderProducts();
    renderCartBadge();
</script>
</body>
</html>
