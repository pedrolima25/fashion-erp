services:
  db:
    image: postgres:15-alpine
    container_name: fashion_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fashion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashion_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fashion_erp}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fashion_user} -d ${POSTGRES_DB:-fashion_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: fashion_erp_app
    restart: unless-stopped
    ports:
      - "${PORT:-8001}:${PORT:-8001}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fashion_user}:${POSTGRES_PASSWORD:-fashion_pass}@db:5432/${POSTGRES_DB:-fashion_erp}
      PORT: "${PORT:-8001}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./tokens:/app/tokens
    command: sh -c "gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:${PORT:-8001}"

volumes:
  postgres_data:
