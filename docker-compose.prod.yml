services:
  db:
    image: postgres:15-alpine
    container_name: fashion_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fashion_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: fashion_erp
    volumes:
      - fashion_erp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion_user -d fashion_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fashion_erp_net

  app:
    build: "https://${GH_TOKEN}@github.com/pedrolima25/fashion-erp.git#main"
    container_name: fashion_erp_app
    restart: unless-stopped
    ports:
      - "${PORT:-8001}:${PORT:-8001}"
    environment:
      DATABASE_URL: "postgresql://fashion_user:${POSTGRES_PASSWORD}@db:5432/fashion_erp"
      SECRET_KEY: "${SECRET_KEY}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
      PORT: "${PORT:-8001}"
      PUBLIC_URL: "${PUBLIC_URL}"
      WPP_WEBHOOK_SECRET: "${WPP_WEBHOOK_SECRET}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - fashion_erp_tokens:/app/tokens
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fashion_erp_net

networks:
  fashion_erp_net:

volumes:
  fashion_erp_pg_data:
  fashion_erp_tokens:
